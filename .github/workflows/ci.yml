name: CI

# Fast build+test feedback on every push/PR to main — no version bump, no
# release. See release.yml for the path-filtered release pipeline.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridgething-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridgething-app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run test

  desktop-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: desktop-app
        run: npm install
      - name: cargo check + test
        working-directory: desktop-app/src-tauri
        run: |
          cargo check
          cargo test --bin claude-thing-app
      - name: Debug build (compile only, skip bundling)
        working-directory: desktop-app
        run: npm run tauri -- build --debug --no-bundle
