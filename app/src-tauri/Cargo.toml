[package]
name = "claude-thing-app"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "net", "time", "sync", "io-util", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

[[bin]]
name = "claude-thing-app"
path = "src/main.rs"
